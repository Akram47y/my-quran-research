<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রুট বিশ্লেষণ তালিকা</title>
    <style>

            border: 1px solid #2d6a4f;

            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .root-card:hover {
            background-color: #252525;
            border-color: #52b788;
        }
        .arabic-title {
            color: #74c69d;
            font-size: 1.2em;
            font-weight: bold;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 15px;

            text-decoration: none;
        }

<body>

<div class="container">

                <strong>২৭/১. রুট:</strong> <span class="arabic-title">هـ د ي</span> (হ-দ-য়)
